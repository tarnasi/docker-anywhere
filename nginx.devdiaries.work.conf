# devdiaries.work — nginx (Cloudflare SSL at edge, origin HTTP)
#
# Install:
#   sudo cp nginx.devdiaries.work.conf /etc/nginx/sites-available/devdiaries.work
#   sudo ln -sf /etc/nginx/sites-available/devdiaries.work /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare: SSL/TLS mode → Flexible or Full (this config listens on port 80 only)
# App port: must match PM2/uvicorn (default 8000)

upstream docker_anywhere {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name devdiaries.work www.devdiaries.work;

    access_log /var/log/nginx/devdiaries.work.access.log combined;
    error_log  /var/log/nginx/devdiaries.work.error.log warn;

    # Cloudflare real client IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 10m;

    # Backend down → friendly response (no blank drop)
    error_page 502 503 504 @maintenance;

    location @maintenance {
        internal;
        default_type text/html;
        return 503 '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unavailable</title></head><body style="font-family:system-ui,sans-serif;background:#0f1419;color:#e8edf4;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0"><div style="text-align:center;padding:2rem"><h1>Temporarily unavailable</h1><p style="color:#8b9cb3">The service is restarting. Please refresh in a moment.</p></div></body></html>';
    }

    # Redirect www → apex
    if ($host = www.devdiaries.work) {
        return 301 http://devdiaries.work$request_uri;
    }

    location / {
        proxy_pass http://docker_anywhere;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;

        proxy_intercept_errors on;
    }
}
