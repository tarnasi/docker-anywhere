# Optional — only if you use nginx instead of Caddy / Cloudflare Tunnel
# Cloudflare SSL at edge, origin HTTP on port 80
# App: PM2 on 127.0.0.1:8000

upstream docker_anywhere {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name docker.devdiaries.work;

    access_log /var/log/nginx/docker.devdiaries.work.access.log combined;
    error_log  /var/log/nginx/docker.devdiaries.work.error.log warn;

    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 10m;

    error_page 502 503 504 @maintenance;

    location @maintenance {
        internal;
        default_type text/html;
        return 503 '<!DOCTYPE html><html><body style="font-family:system-ui;background:#0f1419;color:#e8edf4;display:flex;align-items:center;justify-content:center;min-height:100vh"><div style="text-align:center"><h1>Temporarily unavailable</h1></div></body></html>';
    }

    location / {
        proxy_pass http://docker_anywhere;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_intercept_errors on;
    }
}
